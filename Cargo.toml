[workspace]
resolver = "2"
members = [
    "crates/ganesh-core",
    "crates/ganesh-server",
    "crates/ganesh-mcp",
    "crates/ganesh-bench",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/andikapradanaarif/ganesh"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
rust-stemmers = "1.2"
